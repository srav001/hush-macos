# Minimal AeroSpace configuration using the physical Control key directly.

config-version = 2
start-at-login = true
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

after-login-command = []
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Notify only the two local UI processes. Files are per-user and mode 0600.
exec-on-workspace-change = ['/bin/bash', '-c',
  'umask 077; printf "%s\n" "$AEROSPACE_FOCUSED_WORKSPACE" > "/tmp/hush-bar-ws-$UID"'
]

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.right = 8
# A notched built-in display already reserves the camera strip.
outer.top = [{ monitor.'built-in' = 10 }, 42]

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[mode.main.binding]
# Existing applications
ctrl-enter = 'exec-and-forget open -na Ghostty'

# Window lifecycle and layout
ctrl-w = 'close'
ctrl-q = 'exec-and-forget "$HOME/.local/bin/hush-bar" --quit-frontmost'
ctrl-t = 'layout floating tiling'
ctrl-j = 'layout tiles horizontal vertical'
ctrl-f = 'macos-native-fullscreen'
ctrl-minus = 'resize smart -50'
ctrl-equal = 'resize smart +50'

# Focus
ctrl-left = 'focus left'
ctrl-down = 'focus down'
ctrl-up = 'focus up'
ctrl-right = 'focus right'

# Move windows
ctrl-shift-left = 'move left'
ctrl-shift-down = 'move down'
ctrl-shift-up = 'move up'
ctrl-shift-right = 'move right'

# Workspaces
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-4 = 'workspace 4'
ctrl-5 = 'workspace 5'
ctrl-6 = 'workspace 6'
ctrl-7 = 'workspace 7'
ctrl-8 = 'workspace 8'
ctrl-9 = 'workspace 9'

ctrl-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
ctrl-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
ctrl-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
ctrl-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
ctrl-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
ctrl-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
ctrl-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
ctrl-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
ctrl-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
ctrl-tab = 'workspace-back-and-forth'

# Explicit resize mode for longer adjustments.
ctrl-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
minus = 'resize smart -50'
equal = 'resize smart +50'
enter = 'mode main'
esc = 'mode main'
